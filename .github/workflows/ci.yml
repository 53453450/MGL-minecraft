name: ci

# Automatic CI paused (hosted macos-26 Paravirt differs from physical Apple Silicon).
# Re-enable push/pull_request triggers when the runner environment is sorted.
on:
  workflow_dispatch:
    inputs:
      full_gpu:
        description: "Run full GPU regression without Paravirt skips (needs real Apple GPU)"
        type: boolean
        default: false

jobs:
  macos-gate:
    # macOS 26+ only.  The aux metallibs injected into mgl_aux_assets.c are
    # produced by the Metal 4 frontend (Xcode 26 / macOS 26 SDK).  Xcode 15.4
    # on macos-14 ships a Metal 3 frontend and rejects them outright with
    # "lambda expressions are not supported in Metal".  Keep this label in
    # sync with MGL_MIN_MACOS_SDK_MAJOR in the Makefile.
    #
    # GitHub-hosted macos-26 exposes Apple Paravirtual device, not a real
    # AGX GPU.  Some AIR compute/GS PSOs fail there with "Compilation failed"
    # while passing on physical Apple silicon.  The hosted job therefore skips
    # those cases (MGL_SKIP_PARAVIRT_UNRELIABLE=1) and leaves a diagnostic
    # step that still runs one failing case for Metal error detail.
    # Full GPU coverage: enable job macos-gpu-self-hosted below on a runner
    # labeled [self-hosted, macOS, ARM64, mgl-gpu], or workflow_dispatch with
    # full_gpu=true on a machine that has a real Apple GPU.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain baseline
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx metal --version
          make verify-toolchain

      - name: Verify GL ABI against pinned gl.xml
        run: make verify-gl-api

      - name: Install toolchain
        run: |
          brew install llvm@15 cmake
          echo "LLVM_ROOT=$(brew --prefix llvm@15)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@15)/bin" >> "$GITHUB_PATH"

      - name: Detect Metal device
        run: |
          NAME=$(swift -e 'import Metal; print(MTLCreateSystemDefaultDevice()?.name ?? "none")' 2>/dev/null || echo none)
          echo "Metal device: $NAME"
          echo "METAL_DEVICE_NAME=$NAME" >> "$GITHUB_ENV"
          if [ "${{ inputs.full_gpu }}" = "true" ]; then
            echo "full_gpu requested; not setting Paravirt skips"
          elif echo "$NAME" | grep -qi paravirtual; then
            echo "MGL_SKIP_PARAVIRT_UNRELIABLE=1" >> "$GITHUB_ENV"
            echo "::warning::Apple Paravirtual GPU detected; skipping known-unreliable GPU regression cases. Full gate needs self-hosted real Apple GPU (see macos-gpu-self-hosted) or workflow_dispatch full_gpu=true."
          fi

      - name: Build GoogleTest
        run: make gtest

      - name: Build libraries
        run: make -j4 lib

      - name: CPU correctness probes
        run: |
          make test-arch-correctness
          make test-mglair-gtest
          make test-dirty-hash

      - name: Perf smoke (CPU benchmarks)
        run: make test-benchmark

      - name: Headless regression (do not auto-update golden)
        run: make test-regression

      - name: Paravirt Metal PSO diagnostic
        if: env.MGL_SKIP_PARAVIRT_UNRELIABLE == '1'
        continue-on-error: true
        run: |
          echo "Re-running two known Paravirt failures without skip to capture enriched Metal errors"
          unset MGL_SKIP_PARAVIRT_UNRELIABLE
          DYLD_LIBRARY_PATH="$(pwd)/build" ./build/test_regression \
            --golden-dir "$(pwd)/MGL_Golden_Images" air_geometry_atomic_counter || true
          DYLD_LIBRARY_PATH="$(pwd)/build" ./build/test_regression \
            --golden-dir "$(pwd)/MGL_Golden_Images" compute_dispatch_ssbo || true

      - name: Full test-all
        run: make test-all

  # Optional full GPU regression on a real Apple Silicon Mac.
  # Register a self-hosted runner with labels: self-hosted, macOS, ARM64, mgl-gpu
  # then flip the if: condition to true (or remove it).
  macos-gpu-self-hosted:
    if: ${{ false }}
    runs-on: [self-hosted, macOS, ARM64, mgl-gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain baseline
        run: make verify-toolchain
      - name: Install toolchain
        run: |
          brew install llvm@15 cmake
          echo "LLVM_ROOT=$(brew --prefix llvm@15)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@15)/bin" >> "$GITHUB_PATH"
      - name: Build and full regression (no Paravirt skips)
        run: |
          make -j4 lib
          make test-regression
          make test-all
