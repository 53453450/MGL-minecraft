# Acceptance gates for ObjC state-sink Phase 0–7.
name: objc-state-sink-gates

on:
  push:
    branches: [main, 'cursor/objc-state-sink-*']
  pull_request:
    branches: [main]

jobs:
  linux-gtest:
    name: Linux state-dirty gtest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ cmake
      - name: Build GoogleTest
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/google/googletest.git "$HOME/googletest"
          cmake -S "$HOME/googletest" -B "$HOME/googletest/build-mgl" \
            -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_STANDARD=20
          cmake --build "$HOME/googletest/build-mgl" -j"$(nproc)"
      - name: LOC + compat gates
        run: |
          set -euo pipefail
          LOC=$(wc -l MGL/src/MGLRenderer*.m MGL/src/MGLPlatformRendererShell.m 2>/dev/null | tail -1 | awk '{print $1}')
          echo "ObjC renderer LOC=$LOC (limit 2000)"
          test "$LOC" -lt 2000
          if git grep -n mglRendererCompat; then
            echo "FAIL: mglRendererCompat references remain" >&2
            exit 1
          fi
          echo "compat grep: clean"
      - name: test-mgl-state-dirty-gtest
        run: make test-mgl-state-dirty-gtest HOST_GTEST_CXX=g++

  macos-metal:
    name: macOS metalcpp + regression
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 15 + GoogleTest
        run: |
          brew install llvm@15 cmake
          git clone --depth 1 --branch v1.14.0 https://github.com/google/googletest.git "$HOME/googletest"
          cmake -S "$HOME/googletest" -B "$HOME/googletest/build-mgl" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@15)/bin/clang++" \
            -DCMAKE_CXX_STANDARD=20
          cmake --build "$HOME/googletest/build-mgl" -j"$(sysctl -n hw.ncpu)"
      - name: LOC + compat gates
        run: |
          set -euo pipefail
          LOC=$(wc -l MGL/src/MGLRenderer*.m MGL/src/MGLPlatformRendererShell.m 2>/dev/null | tail -1 | awk '{print $1}')
          echo "ObjC renderer LOC=$LOC (limit 2000)"
          test "$LOC" -lt 2000
          if git grep -n mglRendererCompat; then
            echo "FAIL: mglRendererCompat references remain" >&2
            exit 1
          fi
      - name: test-mgl-state-dirty-gtest
        run: make test-mgl-state-dirty-gtest
      - name: test-metalcpp
        env:
          LLVM_ROOT: /opt/homebrew/opt/llvm@15
        run: |
          if [ ! -d "$LLVM_ROOT" ]; then
            LLVM_ROOT="$(brew --prefix llvm@15)"
          fi
          export LLVM_ROOT
          make test-metalcpp
      - name: build libmgl + test-regression
        env:
          LLVM_ROOT: /opt/homebrew/opt/llvm@15
        run: |
          if [ ! -d "$LLVM_ROOT" ]; then
            LLVM_ROOT="$(brew --prefix llvm@15)"
          fi
          export LLVM_ROOT
          make lib
          make test-regression
